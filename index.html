<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study with Sonochiii - Perfect 24h Clock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap');

        :root {
            --mint-color: #B2E2D2;
            --text-color: #333333;
            --font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: var(--font-family);
        }

        #clock {
            position: relative;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--mint-color) 50%, #ffffff 50%);
            border: 12px solid #ffffff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        /* 目盛りシステム */
        .indicator {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        /* 24時間インデックス */
        .hour-label {
            position: absolute;
            top: 60px;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-color);
        }

        /* 分・秒ドット */
        .dot {
            position: absolute;
            top: 25px;
            width: 6px;
            height: 6px;
            background: #bbb;
            border-radius: 50%;
        }

        /* 5分ごとの太い目盛り */
        .tick-major {
            position: absolute;
            top: 15px;
            width: 4px;
            height: 20px;
            background: var(--text-color);
            border-radius: 2px;
        }

        /* 5分ごとの数字（外側） */
        .min-label {
            position: absolute;
            top: 40px;
            font-size: 16px;
            font-weight: 500;
            color: #666;
        }

        /* 針のデザイン */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #000;
            border-radius: 10px;
            z-index: 10;
        }
        .hour-hand { width: 12px; height: 160px; margin-left: -6px; }
        .min-hand { width: 8px; height: 230px; margin-left: -4px; }
        .sec-hand { width: 3px; height: 250px; margin-left: -1.5px; background: #ff4d4d; z-index: 11; }
        
        .center-cap {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            background: #000;
            border: 4px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
        }

        /* ロゴ（白いエリアの中央） */
        .logo-area {
            position: absolute;
            bottom: 120px;
            width: 100%;
            text-align: center;
            z-index: 5;
        }
        .logo-main { font-size: 36px; font-weight: 800; line-height: 1.1; }
        .logo-sub { font-size: 24px; font-weight: 500; }
    </style>
</head>
<body>

<div id="clock">
    <div id="face"></div>
    <div class="logo-area">
        <div class="logo-sub">Study with</div>
        <div class="logo-main">Sonochiii</div>
    </div>
    <div class="hand hour-hand" id="h-hand"></div>
    <div class="hand min-hand" id="m-hand"></div>
    <div class="hand sec-hand" id="s-hand"></div>
    <div class="center-cap"></div>
</div>

<script>
    const face = document.getElementById('face');

    // 24時間時計の目盛り生成（360度 / 24時間 = 15度ずつ）
    for (let i = 0; i < 60; i++) {
        const container = document.createElement('div');
        container.className = 'indicator';
        container.style.transform = `rotate(${i * 6}deg)`; // 60分割ベース

        if (i % 5 === 0) {
            // 5分刻み / 2時間刻み
            const h24 = (i / 60) * 24;
            const m = i.toString().padStart(2, '0');
            
            container.innerHTML = `
                <div class="tick-major"></div>
                <div class="min-label" style="transform: rotate(-${i * 6}deg)">${m}</div>
                <div class="hour-label" style="transform: rotate(-${i * 6}deg)">${h24 === 0 ? '24' : h24}</div>
            `;
        } else {
            // ドット
            container.innerHTML = `<div class="dot"></div>`;
        }
        face.appendChild(container);
    }

    function runClock() {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();

        // 24時間計の計算: 1時間 = 15度
        const sRot = s * 6;
        const mRot = m * 6 + s * 0.1;
        const hRot = (h % 24) * 15 + m * 0.25;

        document.getElementById('s-hand').style.transform = `rotate(${sRot}deg)`;
        document.getElementById('m-hand').style.transform = `rotate(${mRot}deg)`;
        document.getElementById('h-hand').style.transform = `rotate(${hRot}deg)`;
    }

    setInterval(runClock, 1000);
    runClock();
</script>
</body>
</html>
