<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive 24h Clock - Study with Sonochiii</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');

        :root {
            --mint-color: #B2E2D2;
            --font-main: 'M PLUS Rounded 1c', sans-serif;
            /* 画面幅に合わせて時計のサイズを動的に変更 */
            --clock-size: 90vw; 
            --max-clock-size: 700px;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* 時計の外枠：レスポンシブ設計 */
        #clock-wrapper {
            position: relative;
            width: var(--clock-size);
            height: var(--clock-size);
            max-width: var(--max-clock-size);
            max-height: var(--max-clock-size);
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--mint-color) 50%, #ffffff 50%);
            border: 2vmin solid #f4f4f4; /* 画面比率に合わせた枠線 */
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            aspect-ratio: 1 / 1;
        }

        /* 共通レイヤー */
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        /* --- 目盛りと数字（比率計算） --- */
        .min-label {
            position: absolute;
            top: 3%;
            font-size: 3.5vmin; /* 画面サイズに比例 */
            font-weight: 700;
            color: #666;
        }

        .tick-line {
            position: absolute;
            top: 8%;
            width: 0.8vmin;
            height: 3.5vmin;
            background: #333;
            border-radius: 1vmin;
        }

        .tick-dot {
            position: absolute;
            top: 9.5%;
            width: 1.2vmin;
            height: 1.2vmin;
            background: #bbb;
            border-radius: 50%;
        }

        .hour-label {
            position: absolute;
            top: 13%;
            font-size: 7.5vmin;
            font-weight: 800;
            color: #222;
        }

        /* --- 針（比率計算） --- */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #1a1a1a;
            border-radius: 2vmin;
            z-index: 10;
        }
        .h-hand { width: 2.2vmin; height: 28%; margin-left: -1.1vmin; }
        .m-hand { width: 1.5vmin; height: 42%; margin-left: -0.75vmin; }
        .s-hand { width: 0.5vmin; height: 45%; background: #ff4d4d; margin-left: -0.25vmin; z-index: 11; }

        .center-pin {
            position: absolute;
            top: 50%; left: 50%;
            width: 3.5vmin; height: 3.5vmin;
            background: #1a1a1a;
            border: 0.8vmin solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        /* --- ロゴ（白いエリアの中央） --- */
        .logo-box {
            position: absolute;
            bottom: 22%;
            width: 100%;
            text-align: center;
        }
        .logo-s { font-size: 4vmin; font-weight: 700; margin-bottom: 0.5vmin; }
        .logo-m { font-size: 7vmin; font-weight: 800; line-height: 1; }

        /* PC等大きな画面でのフォントサイズ固定 */
        @media (min-width: 800px) {
            .min-label { font-size: 24px; }
            .hour-label { font-size: 52px; }
            .logo-s { font-size: 30px; }
            .logo-m { font-size: 56px; }
            .h-hand { width: 18px; margin-left: -9px; }
            .m-hand { width: 12px; margin-left: -6px; }
            .s-hand { width: 4px; margin-left: -2px; }
        }
    </style>
</head>
<body>

<div id="clock-wrapper">
    <div id="dial"></div>
    <div class="logo-box">
        <div class="logo-s">Study with</div>
        <div class="logo-main logo-m">Sonochiii</div>
    </div>
    <div class="hand h-hand" id="h"></div>
    <div class="hand m-hand" id="m"></div>
    <div class="hand s-hand" id="s"></div>
    <div class="center-pin"></div>
</div>

<script>
    const dial = document.getElementById('dial');

    // 盤面生成
    for (let i = 0; i < 60; i++) {
        const deg = i * 6;
        const layer = document.createElement('div');
        layer.className = 'layer';
        layer.style.transform = `rotate(${deg}deg)`;

        if (i % 5 === 0) {
            const minStr = i.toString().padStart(2, '0');
            const hourVal = (i / 60) * 24;
            const displayH = hourVal === 0 ? '24' : hourVal;

            layer.innerHTML = `
                <div class="min-label" style="transform: rotate(-${deg}deg)">${minStr}</div>
                <div class="tick-line"></div>
                <div class="hour-label" style="transform: rotate(-${deg}deg)">${displayH}</div>
            `;
        } else {
            layer.innerHTML = `<div class="tick-dot"></div>`;
        }
        dial.appendChild(layer);
    }

    function tick() {
        const d = new Date();
        const s = d.getSeconds();
        const m = d.getMinutes();
        const h = d.getHours();

        const sDeg = s * 6;
        const mDeg = m * 6 + s * 0.1;
        const hDeg = (h % 24) * 15 + m * 0.25;

        document.getElementById('s').style.transform = `rotate(${sDeg}deg)`;
        document.getElementById('m').style.transform = `rotate(${mDeg}deg)`;
        document.getElementById('h').style.transform = `rotate(${hDeg}deg)`;
    }

    setInterval(tick, 1000);
    tick();
</script>
</body>
</html>
