<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Study with Sonochiii - Full Screen 24H Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-green: #B2E2D2;
            --logo-black: #2c2c2c;
            --clock-size: 95vh; /* 画面サイズに合わせて変動 */
        }
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #eee; overflow: hidden;
        }
        .clock {
            width: var(--clock-size); height: var(--clock-size);
            background: linear-gradient(to bottom, var(--mint-green) 50%, #ffffff 50%);
            border: calc(var(--clock-size) * 0.02) solid #fff; border-radius: 50%;
            position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        /* 共通設定：中央配置と回転軸の自動計算 */
        .marker, .hand {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            display: flex; justify-content: center;
        }
        .hour-num { font-size: calc(var(--clock-size) * 0.05); font-weight: 700; color: #333; font-family: 'Zen Maru Gothic', sans-serif; padding-top: calc(var(--clock-size) * 0.07); box-sizing: border-box; }
        
        /* 目盛り：サイズに連動して中心に固定 */
        .tick { position: absolute; width: 2px; height: calc(var(--clock-size) * 0.02); background: #333; top: 0; left: 50%; transform-origin: 0 calc(var(--clock-size) / 2); }
        .dot { position: absolute; width: 4px; height: 4px; background: #999; border-radius: 50%; top: calc(var(--clock-size) * 0.01); left: 50%; transform-origin: 0 calc(var(--clock-size) / 2); }

        /* 針の設定：画面サイズに比率で対応 */
        .hand-line { position: absolute; bottom: 50%; left: 50%; transform: translateX(-50%); border-radius: 4px; transform-origin: bottom center; }
        .hour-hand { width: calc(var(--clock-size) * 0.016); height: calc(var(--clock-size) * 0.26); background: #222; }
        .minute-hand { width: calc(var(--clock-size) * 0.012); height: calc(var(--clock-size) * 0.36); background: #444; }
        .second-hand { width: calc(var(--clock-size) * 0.005); height: calc(var(--clock-size) * 0.42); background: #ff4757; }

        .logo { position: absolute; top: 66%; width: 100%; text-align: center; font-weight: 900; font-size: calc(var(--clock-size) * 0.04); color: var(--logo-black); font-family: 'Zen Maru Gothic', sans-serif; }
        .center-dot { position: absolute; top: 50%; left: 50%; width: calc(var(--clock-size) * 0.03); height: calc(var(--clock-size) * 0.03); background: #222; border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; }
    </style>
</head>
<body>

<div class="clock" id="clock">
    <div class="logo">Study with<br><span style="font-size: 1.2em;">Sonochiii</span></div>
    <div class="center-dot"></div>
    <div class="hand"><div class="hand-line hour-hand" id="hour"></div></div>
    <div class="hand"><div class="hand-line minute-hand" id="minute"></div></div>
    <div class="hand"><div class="hand-line second-hand" id="second"></div></div>
</div>

<script>
    const clock = document.getElementById('clock');
    // メモリ生成：サイズに依存しない相対配置
    for (let i = 1; i <= 24; i++) {
        const rotation = i * 15;
        const hWrap = document.createElement('div');
        hWrap.className = 'marker hour-num';
        hWrap.style.transform = `rotate(${rotation}deg)`;
        hWrap.innerHTML = `<span style="display:inline-block; transform:rotate(-${rotation}deg)">${i}</span>`;
        clock.appendChild(hWrap);
        
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
        clock.appendChild(tick);
    }

    for (let i = 0; i < 60; i++) {
        if (i % 5 !== 0) {
            const rotation = i * 6;
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
            clock.appendChild(dot);
        }
    }
