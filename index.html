<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Study with Sonochilii 24h Clock</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --mint-green: #B2E2C9;
            --clock-size: 500px;
        }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-color); margin: 0; font-family: sans-serif; }
        
        .clock {
            width: var(--clock-size); height: var(--clock-size);
            border-radius: 50%; background: white;
            border: 15px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1), inset 0 0 10px rgba(0,0,0,0.2);
            position: relative; overflow: hidden;
        }

        /* 背景の塗り分け */
        .clock::before {
            content: ''; position: absolute; top: 0; width: 100%; height: 50%;
            background: var(--mint-green); border-bottom: 1px solid #ddd;
        }

        /* 文字盤の数字と目盛り */
        .face-container { position: absolute; width: 100%; height: 100%; }
        .mark { position: absolute; width: 100%; height: 100%; text-align: center; }
        
        /* 数字のスタイル */
        .hour-label { position: absolute; width: 100%; height: 100%; font-weight: bold; font-size: 24px; top: 10px; }
        .min-label { position: absolute; width: 100%; height: 100%; font-size: 14px; top: -15px; color: #555; }

        /* 針のスタイル */
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 4px; }
        .hour-hand { width: 8px; height: 100px; background: #333; z-index: 3; }
        .min-hand { width: 6px; height: 160px; background: #333; z-index: 2; }
        .sec-hand { width: 2px; height: 180px; background: #d00; z-index: 4; }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; background: #333; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; }

        /* ロゴ */
        .logo {
            position: absolute; width: 100%; text-align: center; top: 65%;
            font-weight: bold; font-size: 22px; line-height: 1.2; z-index: 1;
        }
    </style>
</head>
<body>

<div class="clock">
    <div class="face-container" id="face"></div>
    <div class="logo">Study with<br>Sonochilii</div>
    <div class="hand hour-hand" id="hourHand"></div>
    <div class="hand min-hand" id="minHand"></div>
    <div class="hand sec-hand" id="secHand"></div>
    <div class="center-dot"></div>
</div>

<script>
    const face = document.getElementById('face');

    // 文字盤の生成
    for (let i = 0; i < 60; i++) {
        const mark = document.createElement('div');
        mark.className = 'mark';
        mark.style.transform = `rotate(${i * 6}deg)`;

        // 目盛り
        const line = document.createElement('div');
        line.style.width = '2px';
        line.style.height = i % 5 === 0 ? '15px' : '8px';
        line.style.background = '#333';
        line.style.margin = '0 auto';
        mark.appendChild(line);

        // 分の数字 (05, 10...)
        if (i % 5 === 0) {
            const minNum = document.createElement('div');
            minNum.className = 'min-label';
            minNum.innerText = i.toString().padStart(2, '0');
            minNum.style.transform = `rotate(-${i * 6}deg)`;
            mark.appendChild(minNum);
        }
        face.appendChild(mark);
    }

    // 24時間の数字
    for (let i = 0; i < 24; i++) {
        const hMark = document.createElement('div');
        hMark.className = 'mark';
        hMark.style.transform = `rotate(${i * 15}deg)`;
        
        const hNum = document.createElement('div');
        hNum.className = 'hour-label';
        hNum.innerText = i === 0 ? '24' : i;
        hNum.style.transform = `translateY(45px) rotate(-${i * 15}deg)`;
        hMark.appendChild(hNum);
        face.appendChild(hMark);
    }

    function updateClock() {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();

        const sDeg = s * 6;
        const mDeg = m * 6 + s * 0.1;
        const hDeg = (h % 24) * 15 + m * 0.25; // 360/24 = 15度

        document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${sDeg}deg)`;
        document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${mDeg}deg)`;
        document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
</script>
</body>
</html>
