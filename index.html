<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Study with Sonochiii - Educational 24H Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-green: #B2E2D2;
            --logo-black: #2c2c2c;
            --clock-size: 500px;
        }
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #eee;
        }
        .clock {
            width: var(--clock-size); height: var(--clock-size);
            /* 指令：上部ミントグリーン / 下部白 */
            background: linear-gradient(to bottom, var(--mint-green) 50%, #ffffff 50%);
            border: 12px solid #fff; border-radius: 50%;
            position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        /* 幼児教育用：1秒の刻みを強調する針の設定 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            translate: -50% 0;
            border-radius: 4px;
        }
        .hour-hand { width: 10px; height: 130px; background: #222; z-index: 10; }
        .minute-hand { width: 6px; height: 180px; background: #444; z-index: 11; }
        /* 赤い秒針は時間の「最小単位」を象徴 */
        .second-hand { width: 3px; height: 210px; background: #ff4757; z-index: 12; }

        .center-dot { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; background: #222; border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; }
        
        .logo { position: absolute; top: 68%; width: 100%; text-align: center; font-weight: 900; font-size: 1.3rem; line-height: 1.2; color: var(--logo-black); font-family: 'Zen Maru Gothic', sans-serif; z-index: 15; }
        .logo span { font-size: 1.5rem; }
        
        .marker { position: absolute; width: 100%; height: 100%; text-align: center; color: #333; font-family: 'Zen Maru Gothic', sans-serif; }
        .hour-num { font-size: 1.6rem; font-weight: 700; padding: 40px; box-sizing: border-box; }
        .tick { position: absolute; width: 2px; height: 12px; background: #333; left: 50%; top: 0; transform-origin: center 250px; }
    </style>
</head>
<body>

<div class="clock" id="clock">
    <div class="logo">Study with<br><span>Sonochiii</span></div>
    <div class="center-dot"></div>
    <div class="hand hour-hand" id="hour"></div>
    <div class="hand minute-hand" id="minute"></div>
    <div class="hand second-hand" id="second"></div>
</div>

<script>
    const clock = document.getElementById('clock');
    // 24時間メモリ（15度間隔）
    for (let i = 1; i <= 24; i++) {
        const rotation = i * 15;
        const hWrap = document.createElement('div');
        hWrap.className = 'marker hour-num';
        hWrap.style.transform = `rotate(${rotation}deg)`;
        hWrap.innerHTML = `<span style="display:inline-block; transform:rotate(-${rotation}deg)">${i}</span>`;
        clock.appendChild(hWrap);
        
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
        clock.appendChild(tick);
    }

    function update() {
        const now = new Date();
        const s = now.getSeconds(); 
        const m = now.getMinutes(); 
        const h = now.getHours();
        
        // 幼児が認識しやすいよう、あえて秒針の端数値（ミリ秒）を切り捨て
        const sDeg = s * 6; // 360/60
        const mDeg = (m * 6) + (s * 0.1); 
        const hDeg = (h * 15) + (m * 0.25); // 24時間計: 360/24=15度

        document.getElementById('second').style.transform = `rotate(${sDeg}deg)`;
        document.getElementById('minute').style.transform = `rotate(${mDeg}deg)`;
        document.getElementById('hour').style.transform = `rotate(${hDeg}deg)`;
    }
    // 1秒ごとに更新し、刻みのリズムを強調
    setInterval(update, 1000); 
    update();
</script>
</body>
</html>
