<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Perfect Educational 24h Clock - Sonochiii</title>
    <style>
        /* 丸みのある可愛いフォントをロード */
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');

        :root {
            --mint-color: #B2E2D2; /* 完璧なミント色 */
            --font-family: 'M PLUS Rounded 1c', sans-serif;
            --clock-size: 800px;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
            font-family: var(--font-family);
        }

        /* 盤面：上下の色分けを完璧に再現 */
        #clock-face {
            position: relative;
            width: var(--clock-size);
            height: var(--clock-size);
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--mint-color) 50%, #ffffff 50%);
            border: 18px solid #ffffff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        /* インデックス共通 */
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
        }

        /* 外側の「分」の数字：視認性重視 */
        .minute-label {
            position: absolute;
            top: 25px;
            font-size: 24px;
            font-weight: 700;
            color: #666;
        }

        /* 1分刻みの正確なドット */
        .minute-dot {
            position: absolute;
            top: 70px;
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
        }

        /* 5分ごとの太い目盛り */
        .major-tick {
            position: absolute;
            top: 62px;
            width: 6px;
            height: 24px;
            background: #333;
            border-radius: 3px;
        }

        /* 内側の「24時間」の数字：大きく丸みのあるデザイン */
        .hour-label {
            position: absolute;
            top: 110px;
            font-size: 52px;
            font-weight: 800;
            color: #222;
        }

        /* 針：視認性の高い黒（秒針のみ赤） */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 20px;
            z-index: 10;
        }
        .hour-hand { width: 18px; height: 230px; background: #222; margin-left: -9px; }
        .min-hand { width: 12px; height: 330px; background: #222; margin-left: -6px; }
        .sec-hand { width: 4px; height: 360px; background: #ff4560; margin-left: -2px; z-index: 11; }

        /* 中央の軸 */
        .center-nut {
            position: absolute;
            top: 50%; left: 50%;
            width: 28px; height: 28px;
            background: #222;
            border: 5px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        /* ロゴ：白いエリアの垂直・水平中央に配置 */
        .logo-box {
            position: absolute;
            bottom: 18%; /* 白いエリアの中央に調整 */
            width: 100%;
            text-align: center;
            line-height: 1.1;
        }
        .study-with { font-size: 34px; font-weight: 700; }
        .sonochiii { font-size: 60px; font-weight: 800; letter-spacing: -1px; }
    </style>
</head>
<body>

<div id="clock-face">
    <div id="marks-container"></div>
    
    <div class="logo-box">
        <div class="study-with">Study with</div>
        <div class="sonochiii">Sonochiii</div>
    </div>

    <div class="hand hour-hand" id="h-hand"></div>
    <div class="hand min-hand" id="m-hand"></div>
    <div class="hand sec-hand" id="s-hand"></div>
    <div class="center-nut"></div>
</div>

<script>
    const container = document.getElementById('marks-container');

    // 盤面の構築（1分刻み、計60個のレイヤー）
    for (let i = 0; i < 60; i++) {
        const deg = i * 6;
        const layer = document.createElement('div');
        layer.className = 'layer';
        layer.style.transform = `rotate(${deg}deg)`;

        if (i % 5 === 0) {
            // 5分・2時間おきの重要な指標
            const minNum = i.toString().padStart(2, '0');
            const hourNum = (i / 60) * 24;
            const displayHour = hourNum === 0 ? '24' : hourNum;

            layer.innerHTML = `
                <div class="minute-label" style="transform: rotate(-${deg}deg)">${minNum}</div>
                <div class="major-tick"></div>
                <div class="hour-label" style="transform: rotate(-${deg}deg)">${displayHour}</div>
            `;
        } else {
            // 1分ごとのドット
            layer.innerHTML = `<div class="minute-dot"></div>`;
        }
        container.appendChild(layer);
    }

    function syncClock() {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();
        const ms = now.getMilliseconds();

        // 秒：スムーズな動き（教育用にはステップが良い場合は 1000ms 毎に更新）
        const sDeg = (s * 6) + (ms * 0.006);
        // 分：60分で1周
        const mDeg = (m * 6) + (s * 0.1);
        // 時：24時間で1周（1時間 = 15度）
        const hDeg = (h % 24) * 15 + (m * 0.25);

        document.getElementById('s-hand').style.transform = `rotate(${sDeg}deg)`;
        document.getElementById('m-hand').style.transform = `rotate(${mDeg}deg)`;
        document.getElementById('h-hand').style.transform = `rotate(${hDeg}deg)`;

        requestAnimationFrame(syncClock);
    }

    syncClock();
</script>

</body>
</html>
