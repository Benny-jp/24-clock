<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Study with Sonochiii</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --mint: #B2E2D2; --black: #000; --size: min(90vw, 500px); }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #eee; font-family: 'Zen Maru Gothic', sans-serif; overflow: hidden; }
        .clock { width: var(--size); height: var(--size); background: linear-gradient(to right, #fff 50%, var(--mint) 50%); border: 10px solid #fff; border-radius: 50%; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .logo { position: absolute; top: 65%; width: 100%; text-align: center; font-size: 1.2rem; line-height: 1.2; color: var(--black); z-index: 10; pointer-events: none; }
        .logo span { font-size: 1.6rem; display: block; }
        .marker { position: absolute; width: 100%; height: 100%; text-align: center; }
        .hour-num { font-size: 1.5rem; font-weight: 900; padding: 35px; box-sizing: border-box; color: #333; }
        .min-num { font-size: 0.8rem; padding: 10px; box-sizing: border-box; color: #666; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 5px; background: #222; }
        .hour-hand { width: 8px; height: 28%; z-index: 5; }
        .minute-hand { width: 5px; height: 38%; z-index: 6; background: #444; }
        .second-hand { width: 2px; height: 44%; z-index: 7; background: #ff4757; }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; background: #222; border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; }
    </style>
</head>
<body>
<div class="clock" id="clock">
    <div class="logo">Study with<span>Sonochiii</span></div>
    <div class="center-dot"></div>
    <div id="hour" class="hand hour-hand"></div>
    <div id="minute" class="hand minute-hand"></div>
    <div id="second" class="hand second-hand"></div>
</div>
<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
    const clock = document.getElementById('clock');
    for (let i = 1; i <= 24; i++) {
        const h = document.createElement('div'); h.className = 'marker hour-num';
        const r = i * 15; h.style.transform = `rotate(${r}deg)`;
        h.innerHTML = `<div style="transform:rotate(-${r}deg)">${i}</div>`;
        clock.appendChild(h);
    }
    for (let i = 0; i < 60; i += 5) {
        const m = document.createElement('div'); m.className = 'marker min-num';
        const r = i * 6; m.style.transform = `rotate(${r}deg)`;
        m.innerHTML = `<div style="transform:rotate(-${r}deg)">${i==0?'00':i.toString().padStart(2,'0')}</div>`;
        clock.appendChild(m);
    }
    function update() {
        const n = new Date();
        const s = n.getSeconds(), m = n.getMinutes(), h = n.getHours();
        document.getElementById('second').style.transform = `translateX(-50%) rotate(${(s/60)*360}deg)`;
        document.getElementById('minute').style.transform = `translateX(-50%) rotate(${(m/60)*360+(s/60)*6}deg)`;
        document.getElementById('hour').style.transform = `translateX(-50%) rotate(${(h/24)*360+(m/60)*15}deg)`;
    }
    setInterval(update, 1000); update();
</script>
</body>
</html>
