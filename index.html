<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Study with Sonochiii - Perfect Educational Clock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');

        :root {
            --mint-color: #B2E2D2;
            --text-color: #333333;
            --font-main: 'M PLUS Rounded 1c', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            font-family: var(--font-main);
        }

        #clock-body {
            position: relative;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--mint-color) 50%, #ffffff 50%);
            border: 18px solid #f0f0f0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }

        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        /* 最外周：分の数字 */
        .min-label {
            position: absolute;
            top: 20px;
            font-size: 24px;
            font-weight: 700;
            color: #666;
        }

        /* 5分ごとの目盛り線 */
        .tick-line {
            position: absolute;
            top: 60px;
            width: 6px;
            height: 25px;
            background: #333;
            border-radius: 3px;
        }

        /* 1分ごとのドット */
        .tick-dot {
            position: absolute;
            top: 70px;
            width: 8px;
            height: 8px;
            background: #bbb;
            border-radius: 50%;
        }

        /* 内側：24時間の数字 */
        .hour-label {
            position: absolute;
            top: 105px;
            font-size: 48px;
            font-weight: 800;
            color: var(--text-color);
        }

        /* 針のデザイン */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #1a1a1a;
            border-radius: 20px;
            z-index: 10;
        }
        .h-hand { width: 18px; height: 220px; margin-left: -9px; }
        .m-hand { width: 12px; height: 320px; margin-left: -6px; }
        .s-hand { width: 4px; height: 350px; background: #ff4d4d; margin-left: -2px; z-index: 11; }

        .center-pin {
            position: absolute;
            top: 50%; left: 50%;
            width: 26px; height: 26px;
            background: #1a1a1a;
            border: 5px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        /* ロゴ：白いエリアの中央 */
        .logo {
            position: absolute;
            bottom: 180px;
            width: 100%;
            text-align: center;
        }
        .logo-s { font-size: 32px; font-weight: 700; }
        .logo-m { font-size: 56px; font-weight: 800; line-height: 1; }
    </style>
</head>
<body>

<div id="clock-body">
    <div id="dial"></div>
    <div class="logo">
        <div class="logo-s">Study with</div>
        <div class="logo-m">Sonochiii</div>
    </div>
    <div class="hand h-hand" id="h"></div>
    <div class="hand m-hand" id="m"></div>
    <div class="hand s-hand" id="s"></div>
    <div class="center-pin"></div>
</div>

<script>
    const dial = document.getElementById('dial');

    // 60分割の盤面生成
    for (let i = 0; i < 60; i++) {
        const deg = i * 6;
        const layer = document.createElement('div');
        layer.className = 'layer';
        layer.style.transform = `rotate(${deg}deg)`;

        if (i % 5 === 0) {
            const minStr = i.toString().padStart(2, '0');
            const hourVal = (i / 60) * 24;
            const displayH = hourVal === 0 ? '24' : hourVal;

            layer.innerHTML = `
                <div class="min-label" style="transform: rotate(-${deg}deg)">${minStr}</div>
                <div class="tick-line"></div>
                <div class="hour-label" style="transform: rotate(-${deg}deg)">${displayH}</div>
            `;
        } else {
            layer.innerHTML = `<div class="tick-dot"></div>`;
        }
        dial.appendChild(layer);
    }

    function update() {
        const d = new Date();
        const s = d.getSeconds();
        const m = d.getMinutes();
        const h = d.getHours();

        const sDeg = s * 6;
        const mDeg = m * 6 + s * 0.1;
        const hDeg = (h % 24) * 15 + m * 0.25;

        document.getElementById('s').style.transform = `rotate(${sDeg}deg)`;
        document.getElementById('m').style.transform = `rotate(${mDeg}deg)`;
        document.getElementById('h').style.transform = `rotate(${hDeg}deg)`;
    }

    setInterval(update, 1000);
    update();
</script>
</body>
</html>
