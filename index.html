<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Study with Sonochiii - 24h Clock</title>
    <style>
        :root {
            --mint-color: #B2E2D2;
            --bg-color: #F8F9FA;
            --text-main: #333;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Arial Rounded MT Bold', 'Helvetica Round', sans-serif;
        }

        #clock-container {
            position: relative;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: linear-gradient(to bottom, var(--mint-color) 50%, #ffffff 50%);
            border: 15px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* 文字と目盛りのレイアウト */
        .face-element {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 24時間表示（内側） */
        .hour-label {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
        }

        /* 分表示（外側） */
        .minute-label {
            font-size: 14px;
            font-weight: bold;
            color: #666;
        }

        /* ドットと目盛り */
        .tick {
            width: 3px;
            height: 12px;
            background: #333;
            border-radius: 2px;
        }
        .dot {
            width: 5px;
            height: 5px;
            background: #bbb;
            border-radius: 50%;
        }

        /* 針のデザイン */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            z-index: 10;
        }
        .hour-hand {
            width: 10px;
            height: 120px;
            background: #000;
            margin-left: -5px;
        }
        .minute-hand {
            width: 6px;
            height: 180px;
            background: #000;
            margin-left: -3px;
        }
        .second-hand {
            width: 2px;
            height: 200px;
            background: #E63946;
            margin-left: -1px;
            z-index: 11;
        }
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #333;
            border: 3px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 12;
        }

        /* ロゴ */
        .logo {
            position: absolute;
            bottom: 22%;
            width: 100%;
            text-align: center;
            line-height: 1.2;
        }
        .logo-study { font-size: 20px; font-weight: normal; }
        .logo-name { font-size: 28px; font-weight: bold; }
    </style>
</head>
<body>

<div id="clock-container">
    <div id="clock-face"></div>
    <div class="logo">
        <div class="logo-study">Study with</div>
        <div class="logo-name">Sonochiii</div>
    </div>
    
    <div class="hand hour-hand" id="hour"></div>
    <div class="hand minute-hand" id="minute"></div>
    <div class="hand second-hand" id="second"></div>
    <div class="center-dot"></div>
</div>

<script>
    const face = document.getElementById('clock-face');

    // 目盛りと数字の生成
    for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        const el = document.createElement('div');
        el.className = 'face-element';
        el.style.transform = `rotate(${angle}deg)`;

        // 5分ごとの数字と太い目盛り
        if (i % 5 === 0) {
            const hour24 = (i / 5 * 2); // 24時間表記用
            const minVal = i.toString().padStart(2, '0');
            
            el.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="minute-label" style="transform:rotate(-${angle}deg)">${minVal}</div>
                    <div class="tick"></div>
                    <div class="hour-label" style="transform:rotate(-${angle}deg); margin-top:20px;">${hour24 === 0 ? '24' : hour24}</div>
                </div>`;
        } else {
            // ドットの目盛り
            el.innerHTML = `<div class="dot" style="margin-top:15px;"></div>`;
        }
        face.appendChild(el);
    }

    function updateClock() {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours();

        // 24時間計としての針の動き
        const sDeg = s * 6;
        const mDeg = m * 6 + s * 0.1;
        const hDeg = (h % 24) * 15 + m * 0.25; // 360/24 = 15度

        document.getElementById('second').style.transform = `rotate(${sDeg}deg)`;
        document.getElementById('minute').style.transform = `rotate(${mDeg}deg)`;
        document.getElementById('hour').style.transform = `rotate(${hDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
