<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Study with Sonochiii - Full Screen 24H Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-green: #B2E2D2;
            --logo-black: #2c2c2c;
            --clock-size: 95vh; /* 画面全体サイズ */
        }
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #eee;
            overflow: hidden; /* スクロールバー防止 */
        }
        .clock {
            width: var(--clock-size); height: var(--clock-size);
            background: linear-gradient(to bottom, var(--mint-green) 50%, #ffffff 50%);
            border: calc(var(--clock-size) * 0.024) solid #fff; /* サイズ連動 */
            border-radius: 50%;
            position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .logo {
            position: absolute; top: 66%; width: 100%; text-align: center; 
            font-weight: 900; font-size: calc(var(--clock-size) * 0.04); 
            line-height: 1.2; color: var(--logo-black); font-family: 'Zen Maru Gothic', sans-serif;
            z-index: 15; filter: drop-shadow(0 0 2px rgba(255,255,255,0.8));
        }
        .logo span { font-size: calc(var(--clock-size) * 0.05); }

        /* 以下のパーツもサイズ（var(--clock-size)）に連動させて破綻を防ぐ */
        .marker { position: absolute; width: 100%; height: 100%; text-align: center; color: #333; font-family: 'Zen Maru Gothic', sans-serif; }
        .hour-num { font-size: calc(var(--clock-size) * 0.05); font-weight: 700; padding: calc(var(--clock-size) * 0.08); box-sizing: border-box; }
        .tick { position: absolute; width: 2px; height: calc(var(--clock-size) * 0.01); background: #333; left: 50%; transform-origin: 0 calc(var(--clock-size) / 2); }
        .dot { position: absolute; width: 4px; height: 4px; background: #999; border-radius: 50%; left: 50%; transform-origin: 0 calc(var(--clock-size) / 2); }
        
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 4px; background: #222; }
        .hour-hand { width: 8px; height: calc(var(--clock-size) * 0.26); z-index: 10; }
        .minute-hand { width: 5px; height: calc(var(--clock-size) * 0.36); z-index: 11; background: #444; }
        .second-hand { width: 2px; height: calc(var(--clock-size) * 0.42); z-index: 12; background: #ff4757; }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; background: #222; border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; }
    </style>
</head>
<body>

<div class="clock" id="clock">
    <div class="logo">Study with<br><span>Sonochiii</span></div>
    <div class="center-dot"></div>
    <div class="hand hour-hand" id="hour"></div>
    <div class="hand minute-hand" id="minute"></div>
    <div class="hand second-hand" id="second"></div>
</div>

<script>
    const clock = document.getElementById('clock');
    // メモリ生成ロジックの修正：中心軸を動的に取得
    const radius = clock.offsetWidth / 2;

    for (let i = 1; i <= 24; i++) {
        const rotation = i * 15;
        const hWrap = document.createElement('div');
        hWrap.className = 'marker hour-num';
        hWrap.style.transform = `rotate(${rotation}deg)`;
        hWrap.innerHTML = `<span style="display:inline-block; transform:rotate(-${rotation}deg)">${i}</span>`;
        clock.appendChild(hWrap);
        
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.transformOrigin = `0 ${radius}px`; // 中心軸を固定
        tick.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
        clock.appendChild(tick);
    }

    for (let i = 0; i < 60; i++) {
        const rotation = i * 6;
        if (i % 5 !== 0) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.transformOrigin = `0 ${radius}px`; // 中心軸を固定
            dot.style.transform = `translateX(-50%) rotate(${rotation}deg) translateY(5px)`;
            clock.appendChild(dot);
        }
    }

    function update() {
        const now = new Date();
        const s = now.getSeconds(); const m = now.getMinutes(); const h = now.getHours();
        const sDeg = (s / 60) * 360;
        const mDeg = (m / 60) * 360 + (s / 60) * 6;
        const hDeg = (h / 24) * 360 + (m / 60) * 15;
        document.getElementById('second').style.transform = `translateX(-50%) rotate(${sDeg}deg)`;
        document.getElementById('minute').style.transform = `translateX(-50%) rotate(${mDeg}deg)`;
        document.getElementById('hour').style.transform = `translateX(-50%) rotate(${hDeg}deg)`;
    }
    setInterval(update, 1000); update();
</script>
</body>
</html>
