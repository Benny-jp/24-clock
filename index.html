<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study with Sonochiii | 24H Clock</title>
    <style>
        :root {
            --mint-green: #B2E2C9;
            --text-dark: #333;
            --accent-red: #d00;
        }
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .clock-container {
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
        }
        .hand { stroke-linecap: round; transition: transform 0.5s cubic-bezier(0.4, 2.08, 0.55, 0.44); }
        .second-hand { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>

<div class="clock-container">
    <svg viewBox="0 0 400 400">
        <circle cx="200" cy="200" r="195" fill="white" stroke="#e0e0e0" stroke-width="2"/>
        
        <path d="M 200,200 L 5,200 A 195,195 0 0 1 395,200 Z" fill="var(--mint-green)" />
        
        <g id="face-elements"></g>

        <text x="200" y="275" text-anchor="middle" font-weight="bold" font-size="20" fill="var(--text-dark)">Study with</text>
        <text x="200" y="300" text-anchor="middle" font-weight="bold" font-size="20" fill="var(--text-dark)">Sonochiii</text>

        <g id="hands">
            <line id="hour-hand" x1="200" y1="200" x2="200" y2="100" stroke="var(--text-dark)" stroke-width="8" />
            <line id="min-hand" x1="200" y1="200" x2="200" y2="50" stroke="var(--text-dark)" stroke-width="5" />
            <line id="sec-hand" x1="200" y1="200" x2="200" y2="40" stroke="var(--accent-red)" stroke-width="2" />
            <circle cx="200" cy="200" r="6" fill="var(--text-dark)" />
        </g>
    </svg>
</div>

<script>
    const faceElements = document.getElementById('face-elements');
    const hourHand = document.getElementById('hour-hand');
    const minHand = document.getElementById('min-hand');
    const secHand = document.getElementById('sec-hand');

    // 目盛りと数字の描画
    for (let i = 0; i < 60; i++) {
        const angle = (i * 6);
        const isFive = i % 5 === 0;
        
        // 分・秒の目盛り
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const rStart = isFive ? 180 : 185;
        line.setAttribute("x1", 200 + 195 * Math.sin(angle * Math.PI / 180));
        line.setAttribute("y1", 200 - 195 * Math.cos(angle * Math.PI / 180));
        line.setAttribute("x2", 200 + rStart * Math.sin(angle * Math.PI / 180));
        line.setAttribute("y2", 200 - rStart * Math.cos(angle * Math.PI / 180));
        line.setAttribute("stroke", "#333");
        line.setAttribute("stroke-width", isFive ? 3 : 1.5);
        faceElements.appendChild(line);

        // 外周の分数字 (00, 05, 10...)
        if (isFive) {
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            const rText = 170;
            text.setAttribute("x", 200 + rText * Math.sin(angle * Math.PI / 180));
            text.setAttribute("y", 200 - rText * Math.cos(angle * Math.PI / 180) + 5);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "12");
            text.textContent = i.toString().padStart(2, '0');
            faceElements.appendChild(text);
        }
    }

    // 24時間表記の数字
    for (let i = 0; i < 24; i++) {
        const angle = (i * 15);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        const rText = 140;
        text.setAttribute("x", 200 + rText * Math.sin(angle * Math.PI / 180));
        text.setAttribute("y", 200 - rText * Math.cos(angle * Math.PI / 180) + 8);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "22");
        text.setAttribute("font-weight", "bold");
        text.textContent = i === 0 ? "24" : i;
        faceElements.appendChild(text);
    }

    function update() {
        const now = new Date();
        const s = now.getSeconds() + now.getMilliseconds() / 1000;
        const m = now.getMinutes() + s / 60;
        const h = now.getHours() + m / 60;

        // 24時間で360度回転するように設定
        secHand.setAttribute("transform", `rotate(${s * 6}, 200, 200)`);
        minHand.setAttribute("transform", `rotate(${m * 6}, 200, 200)`);
        hourHand.setAttribute("transform", `rotate(${h * 15}, 200, 200)`);
        
        requestAnimationFrame(update);
    }
    update();
</script>
</body>
</html>
