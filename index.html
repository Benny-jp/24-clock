<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonochiii Intelligent 24h Clock v3</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Sonochiii%20Clock%22,%22short_name%22:%22Sonochiii%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23B2E2D2%22}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');
        body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: #fdfdfd; font-family: 'M PLUS Rounded 1c', sans-serif; overflow: hidden; }
        #clock-container { width: 94vmin; height: 94vmin; max-width: 700px; max-height: 700px; position: relative; }
        svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.1)); }
        
        .mint-bg { fill: #B2E2D2; transition: fill 3s ease; }
        .night-bg { fill: #2C3E50; transition: fill 3s ease; }
        .white-bg { fill: #ffffff; }
        
        .text-hour { font-size: 42px; font-weight: 800; fill: #1a1a1a; text-anchor: middle; }
        .text-min { font-size: 20px; font-weight: 700; fill: #888; text-anchor: middle; }
        
        /* 中央ロゴの最適化 */
        .logo-group { pointer-events: none; }
        .logo-study { font-size: 24px; font-weight: 700; fill: #555; text-anchor: middle; }
        .logo-main { font-size: 44px; font-weight: 800; fill: #222; text-anchor: middle; }
        
        /* メッセージエリア */
        .msg-box { fill: rgba(255, 255, 255, 0.85); stroke: rgba(0,0,0,0.05); }
        #status-msg { font-size: 18px; font-weight: 800; fill: #333; text-anchor: middle; }
        .hand { stroke-linecap: round; }
    </style>
</head>
<body>

<div id="clock-container">
    <svg viewBox="0 0 800 800">
        <defs>
            <clipPath id="top-clip"><rect x="0" y="0" width="800" height="400" /></clipPath>
            <clipPath id="bottom-clip"><rect x="0" y="400" width="800" height="400" /></clipPath>
        </defs>
        
        <circle cx="400" cy="400" r="385" id="bg-color" class="mint-bg" clip-path="url(#top-clip)" />
        <circle cx="400" cy="400" r="385" class="white-bg" clip-path="url(#bottom-clip)" />
        <circle cx="400" cy="400" r="385" fill="none" stroke="#e8e8e8" stroke-width="8" />

        <g id="dial-marks"></g>

        <g class="logo-group">
            <text x="400" y="520" class="logo-study">Study with</text>
            <text x="400" y="575" class="logo-main">Sonochilii</text>
        </g>

        <rect x="220" y="270" width="360" height="60" rx="30" class="msg-box" />
        <text x="400" y="308" id="status-msg">Loading...</text>

        <g id="hands">
            <line id="hour-hand" x1="400" y1="400" x2="400" y2="220" stroke="#333" stroke-width="16" class="hand" />
            <line id="min-hand" x1="400" y1="400" x2="400" y2="110" stroke="#333" stroke-width="10" class="hand" />
            <line id="sec-hand" x1="400" y1="400" x2="400" y2="80" stroke="#ff4560" stroke-width="3" class="hand" />
            <circle cx="400" cy="400" r="14" fill="#333" />
            <circle cx="400" cy="400" r="5" fill="#fff" />
        </g>
    </svg>
</div>

<script>
    if ('serviceWorker' in navigator) {
        const sw = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`;
        const blob = new Blob([sw], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    const dialMarks = document.getElementById('dial-marks');
    const svgNS = "http://www.w3.org/2000/svg";

    for (let i = 0; i < 60; i++) {
        const rad = (i * 6 - 90) * (Math.PI / 180);
        if (i % 5 === 0) {
            const h = (i / 60) * 24 || 24;
            const m = i.toString().padStart(2, '0');
            addText(400 + 355 * Math.cos(rad), 400 + 355 * Math.sin(rad) + 7, m, 'text-min');
            addLine(400 + 330 * Math.cos(rad), 400 + 330 * Math.sin(rad), 400 + 300 * Math.cos(rad), 400 + 300 * Math.sin(rad), '#333', 6);
            addText(400 + 245 * Math.cos(rad), 400 + 245 * Math.sin(rad) + 15, h, 'text-hour');
        } else {
            addLine(400 + 330 * Math.cos(rad), 400 + 330 * Math.sin(rad), 400 + 318 * Math.cos(rad), 400 + 318 * Math.sin(rad), '#ccc', 3);
        }
    }

    function addText(x, y, txt, cls) {
        const t = document.createElementNS(svgNS, "text");
        t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("class", cls);
        t.textContent = txt; dialMarks.appendChild(t);
    }

    function addLine(x1, y1, x2, y2, color, width) {
        const l = document.createElementNS(svgNS, "line");
        l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2);
        l.setAttribute("stroke", color); l.setAttribute("stroke-width", width); l.setAttribute("stroke-linecap", "round");
        dialMarks.appendChild(l);
    }

    function update() {
        const now = new Date();
        const s = now.getSeconds() + now.getMilliseconds() / 1000;
        const m = now.getMinutes() + s / 60;
        const h = now.getHours() + m / 60;

        document.getElementById('sec-hand').setAttribute('transform', `rotate(${s * 6}, 400, 400)`);
        document.getElementById('min-hand').setAttribute('transform', `rotate(${m * 6}, 400, 400)`);
        document.getElementById('hour-hand').setAttribute('transform', `rotate(${h * 15}, 400, 400)`);

        const hr = now.getHours();
        const bg = document.getElementById('bg-color');
        const msg = document.getElementById('status-msg');

        // ロジック：21時から3時は紺色、それ以外はミントグリーン
        if (hr >= 21 || hr < 3) {
            bg.setAttribute('class', 'night-bg');
            msg.textContent = "静かな夜を。ゆっくり休みましょう";
        } else {
            bg.setAttribute('class', 'mint-bg');
            if (hr >= 6 && hr < 15) {
                msg.textContent = "Study with Sonochiii 配信中 ♪";
            } else {
                msg.textContent = "今日も素敵な一日を";
            }
        }
        requestAnimationFrame(update);
    }
    update();
</script>
</body>
</html>
