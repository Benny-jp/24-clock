<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study with Sonochiii</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --mint-green: #B2E2D2; --logo-black: #000; --clock-size: min(90vw, 500px); }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #eee; font-family: 'Zen Maru Gothic', sans-serif; overflow: hidden; }
        .clock { width: var(--clock-size); height: var(--clock-size); background: linear-gradient(to right, #ffffff 50%, var(--mint-green) 50%); border: 12px solid #fff; border-radius: 50%; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        .logo { position: absolute; top: 66%; width: 100%; text-align: center; font-weight: 900; font-size: 1.3rem; line-height: 1.2; color: var(--logo-black); z-index: 15; }
        .logo span { font-size: 1.5rem; }
        .marker { position: absolute; width: 100%; height: 100%; text-align: center; color: #333; }
        .hour-num { font-size: 1.6rem; font-weight: 700; padding: 40px; box-sizing: border-box; }
        .min-num { font-size: 0.85rem; font-weight: 500; padding: 10px; box-sizing: border-box; }
        .tick { position: absolute; width: 2px; height: 8px; background: #333; left: 50%; transform-origin: 0 250px; }
        .dot { position: absolute; width: 4px; height: 4px; background: #999; border-radius: 50%; left: 50%; transform-origin: 0 250px; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 4px; background: #222; }
        .hour-hand { width: 8px; height: 26%; z-index: 10; }
        .minute-hand { width: 5px; height: 36%; z-index: 11; background: #444; }
        .second-hand { width: 2px; height: 42%; z-index: 12; background: #ff4757; }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; background: #222; border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; }
    </style>
</head>
<body>
<div class="clock" id="clock">
    <div class="logo">Study with<br><span>Sonochiii</span></div>
    <div class="center-dot"></div>
    <div class="hand hour-hand" id="hour"></div>
    <div class="hand minute-hand" id="minute"></div>
    <div class="hand second-hand" id="second"></div>
</div>
<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
    const clock = document.getElementById('clock');
    const radius = 250;
    for (let i = 1; i <= 24; i++) {
        const hWrap = document.createElement('div'); hWrap.className = 'marker hour-num';
        const rot = i * 15; hWrap.style.transform = `rotate(${rot}deg)`;
        hWrap.innerHTML = `<span style="display:inline-block; transform:rotate(-${rot}deg)">${i}</span>`;
        clock.appendChild(hWrap);
        const tick = document.createElement('div'); tick.className = 'tick';
        tick.style.transform = `translateX(-50%) rotate(${rot}deg)`;
        clock.appendChild(tick);
    }
    for (let i = 0; i < 60; i++) {
        const rot = i * 6;
        if (i % 5 === 0) {
            const mWrap = document.createElement('div'); mWrap.className = 'marker min-num';
            mWrap.style.transform = `rotate(${rot}deg)`;
            mWrap.innerHTML = `<span style="display:inline-block; transform:rotate(-${rot}deg)">${i===0?'00':i.toString().padStart(2,'0')}</span>`;
            clock.appendChild(mWrap);
        } else {
            const dot = document.createElement('div'); dot.className = 'dot';
            dot.style.transform = `translateX(-50%) rotate(${rot}deg) translateY(5px)`;
            clock.appendChild(dot);
        }
    }
    function update() {
        const n = new Date();
        const s = n.getSeconds(); const m = n.getMinutes(); const h = n.getHours();
        document.getElementById('second').style.transform = `translateX(-50%) rotate(${(s/60)*360}deg)`;
        document.getElementById('minute').style.transform = `translateX(-50%) rotate(${(m/60)*360+(s/60)*6}deg)`;
        document.getElementById('hour').style.transform = `translateX(-50%) rotate(${(h/24)*360+(m/60)*15}deg)`;
    }
    setInterval(update, 1000); update();
</script>
</body>
</html>
