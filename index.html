<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonochiii Intelligent 24h Clock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fdfdfd;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overflow: hidden;
        }

        #clock-container {
            width: 95vmin;
            height: 95vmin;
            max-width: 750px;
            max-height: 750px;
            position: relative;
        }

        svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1)); }

        .mint-bg { fill: #B2E2D2; transition: fill 3s ease; }
        .white-bg { fill: #ffffff; }
        .text-hour { font-size: 42px; font-weight: 800; fill: #1a1a1a; text-anchor: middle; }
        .text-min { font-size: 20px; font-weight: 700; fill: #888; text-anchor: middle; }
        .logo-text { font-size: 32px; font-weight: 800; fill: #333; text-anchor: middle; }
        .hand { stroke-linecap: round; transition: stroke 1s; }
        
        #status-msg { font-size: 18px; font-weight: 700; fill: #666; text-anchor: middle; }
    </style>
</head>
<body>

<div id="clock-container">
    <svg viewBox="0 0 800 800">
        <defs>
            <clipPath id="top-clip"><rect x="0" y="0" width="800" height="400" /></clipPath>
            <clipPath id="bottom-clip"><rect x="0" y="400" width="800" height="400" /></clipPath>
        </defs>
        
        <circle cx="400" cy="400" r="380" id="bg-color" class="mint-bg" clip-path="url(#top-clip)" />
        <circle cx="400" cy="400" r="380" class="white-bg" clip-path="url(#bottom-clip)" />
        <circle cx="400" cy="400" r="380" fill="none" stroke="#e0e0e0" stroke-width="8" />

        <g id="dial-marks"></g>

        <text x="400" y="650" class="logo-text">Study with</text>
        <text x="400" y="700" class="logo-text">Sonochilii</text>
        <text x="400" y="550" id="status-msg"></text>

        <g id="hands">
            <line id="hour-hand" x1="400" y1="400" x2="400" y2="230" stroke="#333" stroke-width="16" class="hand" />
            <line id="min-hand" x1="400" y1="400" x2="400" y2="120" stroke="#333" stroke-width="10" class="hand" />
            <line id="sec-hand" x1="400" y1="400" x2="400" y2="90" stroke="#ff4560" stroke-width="3" class="hand" />
            <circle cx="400" cy="400" r="14" fill="#333" />
            <circle cx="400" cy="400" r="5" fill="#fff" />
        </g>
    </svg>
</div>

<script>
    const dialMarks = document.getElementById('dial-marks');
    const svgNS = "http://www.w3.org/2000/svg";

    // 盤面の描画（イラストの正確なインデックス配置）
    for (let i = 0; i < 60; i++) {
        const angle = i * 6; // 6度ずつ（秒・分用）
        const rad = (angle - 90) * (Math.PI / 180);
        
        if (i % 5 === 0) { // 5分/2時間おき
            const hourVal = (i / 60) * 24;
            const displayH = hourVal === 0 ? "24" : hourVal;
            const minStr = i.toString().padStart(2, '0');

            // 外側の分（00, 05, 10...）
            addText(400 + 350 * Math.cos(rad), 400 + 350 * Math.sin(rad) + 7, minStr, 'text-min');
            // 目盛り
            addLine(400 + 325 * Math.cos(rad), 400 + 325 * Math.sin(rad), 
                    400 + 290 * Math.cos(rad), 400 + 290 * Math.sin(rad), '#444', 6);
            // 内側の時間（24, 2, 4...）
            addText(400 + 240 * Math.cos(rad), 400 + 240 * Math.sin(rad) + 15, displayH, 'text-hour');
        } else {
            // 小さな目盛り（ドットではなく線で視認性向上）
            addLine(400 + 325 * Math.cos(rad), 400 + 325 * Math.sin(rad), 
                    400 + 310 * Math.cos(rad), 400 + 310 * Math.sin(rad), '#bbb', 3);
        }
    }

    function addText(x, y, txt, cls) {
        const t = document.createElementNS(svgNS, "text");
        t.setAttribute("x", x); t.setAttribute("y", y);
        t.setAttribute("class", cls);
        t.textContent = txt;
        dialMarks.appendChild(t);
    }

    function addLine(x1, y1, x2, y2, color, width) {
        const l = document.createElementNS(svgNS, "line");
        l.setAttribute("x1", x1); l.setAttribute("y1", y1);
        l.setAttribute("x2", x2); l.setAttribute("y2", y2);
        l.setAttribute("stroke", color); l.setAttribute("stroke-width", width);
        l.setAttribute("stroke-linecap", "round");
        dialMarks.appendChild(l);
    }

    function updateClock() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds() + ms / 1000;
        const m = now.getMinutes() + s / 60;
        const h = now.getHours() + m / 60;

        // 秒針・分針は通常の時計と同じ（1周60単位）
        document.getElementById('sec-hand').setAttribute('transform', `rotate(${s * 6}, 400, 400)`);
        document.getElementById('min-hand').setAttribute('transform', `rotate(${m * 6}, 400, 400)`);
        // 時針は24時間で1周（360 / 24 = 15度/時）
        document.getElementById('hour-hand').setAttribute('transform', `rotate(${h * 15}, 400, 400)`);

        // 教育・治験向け：時間帯による環境最適化
        const hr = now.getHours();
        const bgColor = document.getElementById('bg-color');
        const statusMsg = document.getElementById('status-msg');

        if (hr >= 6 && hr < 15) {
            bgColor.style.fill = "#B2E2D2"; // 集中力を高めるミント
            statusMsg.textContent = "学習タイム：光を浴びて脳を活性化しましょう";
        } else if (hr >= 15 && hr < 21) {
            bgColor.style.fill = "#FFEBCC"; // リラックスのオレンジ
            statusMsg.textContent = "夕食とリラックス：入眠の準備を始めましょう";
        } else {
            bgColor.style.fill = "#2C3E50"; // 深い眠りを誘うネイビー
            statusMsg.textContent = "消灯タイム：ブルーライトを避けて休息を";
            statusMsg.style.fill = "#ecf0f1";
        }
        
        requestAnimationFrame(updateClock);
    }

    updateClock();
</script>
</body>
</html>
