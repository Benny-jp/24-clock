<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study with Sonochiii - Ultimate 24H Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-green: #B2E2D2;
            --logo-black: #2c2c2c;
            --clock-size: 90vmin; 
        }
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #f5f5f5; overflow: hidden;
        }
        .clock {
            width: var(--clock-size); height: var(--clock-size);
            background: linear-gradient(to bottom, var(--mint-green) 50%, #ffffff 50%);
            border: calc(var(--clock-size) * 0.02) solid #fff; border-radius: 50%;
            position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .logo {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-top: calc(var(--clock-size) * 0.35); 
            font-weight: 900; font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--logo-black); line-height: 1.1; pointer-events: none; z-index: 5;
        }
        .logo .label { font-size: calc(var(--clock-size) * 0.035); opacity: 0.8; }
        .logo .brand { font-size: calc(var(--clock-size) * 0.06); letter-spacing: 0.02em; }

        .marker-layer { position: absolute; inset: 0; border-radius: 50%; }
        
        /* 24時間数字（内側） */
        .hour-num {
            position: absolute; width: 100%; height: 100%; text-align: center;
            font-size: calc(var(--clock-size) * 0.07); font-weight: 900;
            padding-top: calc(var(--clock-size) * 0.12); box-sizing: border-box;
            color: #222; font-family: 'Zen Maru Gothic', sans-serif;
        }
        /* 5分刻み数字（最外周）：太字でかわいい */
        .min-num {
            position: absolute; width: 100%; height: 100%; text-align: center;
            font-size: calc(var(--clock-size) * 0.045); font-weight: 900;
            padding-top: calc(var(--clock-size) * 0.02); box-sizing: border-box;
            color: #444; font-family: 'Zen Maru Gothic', sans-serif;
        }
        
        /* 1分刻みのドット：回転軸を時計の中心に固定 */
        .dot { 
            position: absolute; 
            width: calc(var(--clock-size) * 0.008); 
            height: calc(var(--clock-size) * 0.008); 
            background: #bbb; border-radius: 50%; 
            left: 50%; top: calc(var(--clock-size) * 0.075); 
            transform: translateX(-50%); 
            transform-origin: 50% calc(var(--clock-size) / 2 - calc(var(--clock-size) * 0.075)); 
        }
        
        .hand-container { position: absolute; inset: 0; z-index: 10; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 10px; translate: -50% 0; }
        .hour-hand { width: calc(var(--clock-size) * 0.022); height: calc(var(--clock-size) * 0.25); background: #222; }
        .minute-hand { width: calc(var(--clock-size) * 0.015); height: calc(var(--clock-size) * 0.35); background: #444; }
        .second-hand { width: calc(var(--clock-size) * 0.007); height: calc(var(--clock-size) * 0.42); background: #ff4757; }
        
        .center-dot { position: absolute; inset: 0; margin: auto; width: calc(var(--clock-size) * 0.035); height: calc(var(--clock-size) * 0.035); background: #222; border-radius: 50%; z-index: 20; border: 2px solid #fff; }
    </style>
</head>
<body>

<div class="clock" id="clock">
    <div class="logo">
        <div class="label">Study with</div>
        <div class="brand">Sonochiii</div>
    </div>
    <div class="center-dot"></div>
    <div id="h-hand-c" class="hand-container"><div class="hand hour-hand"></div></div>
    <div id="m-hand-c" class="hand-container"><div class="hand minute-hand"></div></div>
    <div id="s-hand-c" class="hand-container"><div class="hand second-hand"></div></div>
</div>

<script>
    const clock = document.getElementById('clock');
    
    // 24時間表示
    for (let i = 1; i <= 24; i++) {
        const rotation = i * 15;
        const hWrap = document.createElement('div');
        hWrap.className = 'marker-layer hour-num';
        hWrap.style.transform = `rotate(${rotation}deg)`;
        hWrap.innerHTML = `<span style="display:inline-block; transform:rotate(-${rotation}deg)">${i}</span>`;
        clock.appendChild(hWrap);
    }

    // 1分刻みのドットと5分刻みの数字
    for (let i = 0; i < 60; i++) {
        const rotation = (i / 60) * 360;
        if (i % 5 === 0) {
            const mWrap = document.createElement('div');
            mWrap.className = 'marker-layer min-num';
            mWrap.style.transform = `rotate(${rotation}deg)`;
            const label = i.toString().padStart(2, '0');
            mWrap.innerHTML = `<span style="display:inline-block; transform:rotate(-${rotation}deg)">${label}</span>`;
            clock.appendChild(mWrap);
        } else {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
            clock.appendChild(dot);
        }
    }

    function update() {
        const now = new Date();
        const s = now.getSeconds(); const m = now.getMinutes(); const h = now.getHours();
        document.getElementById('s-hand-c').style.transform = `rotate(${s * 6}deg)`;
        document.getElementById('m-hand-c').style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        document.getElementById('h-hand-c').style.transform = `rotate(${h * 15 + m * 0.25}deg)`;
    }
    setInterval(update, 1000); update();
</script>
</body>
</html>
