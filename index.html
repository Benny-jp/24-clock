<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study with Sonochiii - Final Standard</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-green: #B2E2D2;
            --logo-black: #2c2c2c;
            --clock-size: 90vmin;
        }
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #f5f5f5; overflow: hidden;
        }
        .clock {
            width: var(--clock-size); height: var(--clock-size);
            background: linear-gradient(to bottom, var(--mint-green) 50%, #ffffff 50%);
            border: calc(var(--clock-size) * 0.02) solid #fff; border-radius: 50%;
            position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        /* 数字の基本スタイル：すべて直立状態で配置 */
        .marker {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Zen Maru Gothic', sans-serif;
            pointer-events: none;
        }
        .hour-num { font-size: calc(var(--clock-size) * 0.065); font-weight: 900; color: #222; }
        .min-num { font-size: calc(var(--clock-size) * 0.045); font-weight: 900; color: #444; }
        
        /* 1分刻みのドット */
        .dot {
            position: absolute; width: calc(var(--clock-size) * 0.008); height: calc(var(--clock-size) * 0.008);
            background: #bbb; border-radius: 50%; transform: translate(-50%, -50%);
        }

        /* ロゴ：視認性を確保した中央下部配置 */
        .logo {
            position: absolute; width: 100%; top: 68%;
            display: flex; flex-direction: column; align-items: center;
            font-weight: 900; font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--logo-black); line-height: 1.1; pointer-events: none;
        }
        .logo .label { font-size: calc(var(--clock-size) * 0.035); opacity: 0.8; }
        .logo .brand { font-size: calc(var(--clock-size) * 0.06); letter-spacing: 0.02em; }

        /* 針のデザイン */
        .hand-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 10px; translate: -50% 0; }
        .hour-hand { width: calc(var(--clock-size) * 0.02); height: calc(var(--clock-size) * 0.25); background: #222; }
        .minute-hand { width: calc(var(--clock-size) * 0.012); height: calc(var(--clock-size) * 0.35); background: #444; }
        .second-hand { width: calc(var(--clock-size) * 0.006); height: calc(var(--clock-size) * 0.42); background: #ff4757; }
        .center-dot { position: absolute; inset: 0; margin: auto; width: calc(var(--clock-size) * 0.03); height: calc(var(--clock-size) * 0.03); background: #222; border-radius: 50%; z-index: 20; border: 2px solid #fff; }
    </style>
</head>
<body>

<div class="clock" id="clock">
    <div class="logo"><div class="label">Study with</div><div class="brand">Sonochiii</div></div>
    <div class="center-dot"></div>
    <div id="h-hand-c" class="hand-container"><div class="hand hour-hand"></div></div>
    <div id="m-hand-c" class="hand-container"><div class="hand minute-hand"></div></div>
    <div id="s-hand-c" class="hand-container"><div class="hand second-hand"></div></div>
</div>

<script>
    const clock = document.getElementById('clock');
    const size = clock.offsetWidth;
    const center = size / 2;

    function placeMarker(value, angleDeg, distanceFactor, className) {
        const angleRad = (angleDeg - 90) * (Math.PI / 180);
        const x = center + (size * distanceFactor) * Math.cos(angleRad);
        const y = center + (size * distanceFactor) * Math.sin(angleRad);
        const el = document.createElement('div');
        el.className = className;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.innerHTML = value;
        clock.appendChild(el);
    }

    // 24時間インデックス（中周：距離35%）
    for (let i = 1; i <= 24; i++) {
        placeMarker(i, i * 15, 0.35, 'marker hour-num');
    }
