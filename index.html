<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonochiii Intelligent 24h Clock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            transition: background-color 2s ease;
        }

        #clock-container {
            width: 92vmin;
            height: 92vmin;
            max-width: 800px;
            max-height: 800px;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.06));
        }

        /* 動的に変更可能なスタイル */
        .mint-bg { fill: #B2E2D2; transition: fill 2s ease; }
        .white-bg { fill: #ffffff; }
        .text-hour { font-size: 46px; font-weight: 800; fill: #222; text-anchor: middle; }
        .text-min { font-size: 22px; font-weight: 700; fill: #777; text-anchor: middle; }
        .logo-study { font-size: 28px; font-weight: 700; fill: #444; text-anchor: middle; }
        .logo-name { font-size: 52px; font-weight: 800; fill: #222; text-anchor: middle; }
        .hand { stroke-linecap: round; }
        
        /* メッセージ表示エリア */
        #status-msg { font-size: 20px; font-weight: 700; fill: #555; text-anchor: middle; opacity: 0.8; }
    </style>
</head>
<body>

<div id="clock-container">
    <svg viewBox="0 0 800 800">
        <defs>
            <clipPath id="top-clip"><rect x="0" y="0" width="800" height="400" /></clipPath>
            <clipPath id="bottom-clip"><rect x="0" y="400" width="800" height="400" /></clipPath>
        </defs>
        
        <circle cx="400" cy="400" r="385" id="top-sector" class="mint-bg" clip-path="url(#top-clip)" />
        <circle cx="400" cy="400" r="385" class="white-bg" clip-path="url(#bottom-clip)" />
        <circle cx="400" cy="400" r="385" fill="none" stroke="#f5f5f5" stroke-width="12" />

        <g id="dial-marks"></g>

        <text x="400" y="480" id="status-msg">今日も一緒に頑張りましょう！</text>
        <text x="400" y="560" class="logo-study">Study with</text>
        <text x="400" y="620" class="logo-name">Sonochiii</text>

        <g id="hands">
            <line id="hour-hand" x1="400" y1="400" x2="400" y2="200" stroke="#222" stroke-width="18" class="hand" />
            <line id="min-hand" x1="400" y1="400" x2="400" y2="100" stroke="#222" stroke-width="12" class="hand" />
            <line id="sec-hand" x1="400" y1="400" x2="400" y2="70" stroke="#ff4560" stroke-width="4" class="hand" />
            <circle cx="400" cy="400" r="16" fill="#222" />
            <circle cx="400" cy="400" r="6" fill="#fff" />
        </g>
    </svg>
</div>

<script>
    const dialMarks = document.getElementById('dial-marks');
    const svgNS = "http://www.w3.org/2000/svg";

    // 盤面生成（イラストの精密再現）
    for (let i = 0; i < 60; i++) {
        const angle = i * 6;
        const rad = (angle - 90) * (Math.PI / 180);
        
        if (i % 5 === 0) {
            const displayH = ((i / 60) * 24 === 0) ? '24' : (i / 60) * 24;
            const minStr = i.toString().padStart(2, '0');

            addText(400 + 355 * Math.cos(rad), 400 + 355 * Math.sin(rad) + 8, minStr, 'text-min');
            addLine(400 + 330 * Math.cos(rad), 400 + 330 * Math.sin(rad), 
                    400 + 300 * Math.cos(rad), 400 + 300 * Math.sin(rad), '#333', 7);
            addText(400 + 245 * Math.cos(rad), 400 + 245 * Math.sin(rad) + 16, displayH, 'text-hour');
        } else {
            const circle = document.createElementNS(svgNS, "circle");
            circle.setAttribute("cx", 400 + 315 * Math.cos(rad));
            circle.setAttribute("cy", 400 + 315 * Math.sin(rad));
            circle.setAttribute("r", 5);
            circle.setAttribute("fill", "#ccc");
            dialMarks.appendChild(circle);
        }
    }

    function addText(x, y, txt, cls) {
        const t = document.createElementNS(svgNS, "text");
        t.setAttribute("x", x); t.setAttribute("y", y);
        t.setAttribute("class", cls);
        t.textContent = txt;
        dialMarks.appendChild(t);
    }

    function addLine(x1, y1, x2, y2, color, width) {
        const l = document.createElementNS(svgNS, "line");
        l.setAttribute("x1", x1); l.setAttribute("y1", y1);
        l.setAttribute("x2", x2); l.setAttribute("y2", y2);
        l.setAttribute("stroke", color); l.setAttribute("stroke-width", width);
        l.setAttribute("stroke-linecap", "round");
        dialMarks.appendChild(l);
    }

    // オートメーション機能：時間に応じた変化
    function updateAutomation(hours) {
        const topSector = document.getElementById('top-sector');
        const statusMsg = document.getElementById('status-msg');
        
        if (hours >= 6 && hours < 15) { // 配信時間帯
            topSector.style.fill = "#B2E2D2"; // ミント
            statusMsg.textContent = "Study with Sonochiii 配信中 ♪";
        } else if (hours >= 15 && hours < 21) {
            topSector.style.fill = "#FFD1DC"; // 休憩：淡いピンク
            statusMsg.textContent = "今日の復習をしましょう";
        } else {
            topSector.style.fill = "#AEC6CF"; // 夜間：パステルブルー
            statusMsg.textContent = "しっかり休んで明日も笑顔で";
        }
    }

    function animate() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds() + ms / 1000;
        const m = now.getMinutes() + s / 60;
        const h = (now.getHours() % 24) + m / 60;

        document.getElementById('sec-hand').setAttribute('transform', `rotate(${s * 6}, 400, 400)`);
        document.getElementById('min-hand').setAttribute('transform', `rotate(${m * 6}, 400, 400)`);
        document.getElementById('hour-hand').setAttribute('transform', `rotate(${h * 15}, 400, 400)`);
        
        if (now.getSeconds() === 0) updateAutomation(now.getHours());
        requestAnimationFrame(animate);
    }

    updateAutomation(new Date().getHours());
    animate();
</script>
</body>
</html>
